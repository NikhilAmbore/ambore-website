<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="g" x1="10" y1="92" x2="90" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1b4b"/>
      <stop offset="55%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Left leg of A -->
  <polygon points="50,8 37,8 8,92 22,92" fill="url(#g)"/>

  <!-- Right leg of A -->
  <polygon points="50,8 63,8 92,92 78,92" fill="url(#g)"/>

  <!-- Crossbar -->
  <rect x="28" y="56" width="44" height="12" rx="5" fill="url(#g)"/>

  <!-- Person head (inside A, above crossbar) -->
  <circle cx="50" cy="38" r="9" fill="#0d1b4b"/>

  <!-- Person body -->
  <path d="M36,68 Q37,54 50,51 Q63,54 64,68 Z" fill="#0d1b4b"/>

  <!-- Tie -->
  <path d="M50,53 L47,62 L50,67 L53,62 Z" fill="#3b82f6"/>

  <!-- Swoosh: diagonal arc across the A -->
  <path d="M12,80 C30,58 55,38 84,26"
        stroke="#3b82f6" stroke-width="5.5" fill="none"
        stroke-linecap="round" opacity="0.85"/>

  <!-- 4-pointed sparkle at swoosh tip -->
  <path d="M84,20 L85.8,25.5 L91,20 L85.8,23.8 L84,29.5 L82.2,23.8 L77,20 L82.2,16.2 Z"
        fill="#60a5fa"/>
</svg>
