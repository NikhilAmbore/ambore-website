  <rect x="84" y="188" width="4" height="12" rx="2" fill="#6d5cff" opacity="0.5"/>
  <rect x="92" y="186" width="4" height="16" rx="2" fill="#6d5cff" opacity="0.6"/>
  <rect x="100" y="190" width="4" height="8" rx="2" fill="#6d5cff" opacity="0.4"/>
  <rect x="108" y="185" width="4" height="18" rx="2" fill="#9c5fff" opacity="0.7"/>
  <rect x="116" y="189" width="4" height="10" rx="2" fill="#6d5cff" opacity="0.5"/>
