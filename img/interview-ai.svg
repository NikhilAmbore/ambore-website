  <rect x="140" y="188" width="4" height="12" rx="2" fill="#6d5cff" opacity="0.5"/>
  <rect x="148" y="186" width="4" height="16" rx="2" fill="#6d5cff" opacity="0.6"/>
  <text x="164" y="197" font-family="Inter,sans-serif" font-size="8" fill="rgba(255,255,255,0.3)">Recording…</text>
  <circle cx="254" cy="194" r="6" fill="#ef4444" opacity="0.9"/>
