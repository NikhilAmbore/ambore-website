<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6d5cff"/>
      <stop offset="100%" stop-color="#9c5fff"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e0e1d"/>
      <stop offset="100%" stop-color="#13132a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#6d5cff" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background glow orbs -->
  <circle cx="260" cy="200" r="180" fill="url(#grad1)" opacity="0.05"/>
  <circle cx="400" cy="100" r="100" fill="#9c5fff" opacity="0.06"/>
  <circle cx="100" cy="320" r="120" fill="#6d5cff" opacity="0.06"/>

  <!-- Laptop base -->
  <rect x="100" y="260" width="320" height="16" rx="8" fill="#1a1a30"/>
  <rect x="80" y="272" width="360" height="8" rx="4" fill="#13132a"/>

  <!-- Laptop screen body -->
  <rect x="110" y="80" width="300" height="188" rx="12" fill="#1a1a30" filter="url(#shadow)"/>
  <rect x="118" y="88" width="284" height="172" rx="8" fill="url(#screenGrad)"/>

  <!-- Screen content — code editor mockup -->
  <!-- Top bar -->
  <rect x="118" y="88" width="284" height="22" rx="8" fill="#0a0a18"/>
  <rect x="118" y="100" width="284" height="10" fill="#0a0a18"/>
  <circle cx="132" cy="99" r="4" fill="#ef4444" opacity="0.8"/>
  <circle cx="146" cy="99" r="4" fill="#fbbf24" opacity="0.8"/>
  <circle cx="160" cy="99" r="4" fill="#22c55e" opacity="0.8"/>

  <!-- Code lines -->
  <rect x="130" y="120" width="60" height="6" rx="3" fill="#6d5cff" opacity="0.9"/>
  <rect x="196" y="120" width="40" height="6" rx="3" fill="#a78bfa" opacity="0.6"/>
  <rect x="130" y="134" width="20" height="6" rx="3" fill="#818cf8" opacity="0.5"/>
  <rect x="156" y="134" width="50" height="6" rx="3" fill="#22c55e" opacity="0.7"/>
  <rect x="212" y="134" width="30" height="6" rx="3" fill="#fbbf24" opacity="0.6"/>
  <rect x="130" y="148" width="80" height="6" rx="3" fill="#a78bfa" opacity="0.5"/>
  <rect x="130" y="162" width="20" height="6" rx="3" fill="#6d5cff" opacity="0.8"/>
  <rect x="156" y="162" width="35" height="6" rx="3" fill="#818cf8" opacity="0.6"/>
  <rect x="197" y="162" width="55" height="6" rx="3" fill="#22c55e" opacity="0.5"/>
  <rect x="130" y="176" width="45" height="6" rx="3" fill="#fbbf24" opacity="0.4"/>
  <rect x="181" y="176" width="65" height="6" rx="3" fill="#a78bfa" opacity="0.5"/>
  <rect x="130" y="190" width="100" height="6" rx="3" fill="#6d5cff" opacity="0.6"/>
  <rect x="130" y="204" width="25" height="6" rx="3" fill="#818cf8" opacity="0.4"/>
  <rect x="161" y="204" width="70" height="6" rx="3" fill="#a78bfa" opacity="0.5"/>
  <rect x="130" y="218" width="55" height="6" rx="3" fill="#22c55e" opacity="0.6"/>
  <rect x="191" y="218" width="40" height="6" rx="3" fill="#fbbf24" opacity="0.5"/>
  <rect x="130" y="232" width="30" height="6" rx="3" fill="#6d5cff" opacity="0.7"/>
  <rect x="166" y="232" width="80" height="6" rx="3" fill="#818cf8" opacity="0.4"/>

  <!-- Floating card 1 — Resume Score -->
  <rect x="340" y="100" width="150" height="80" rx="12" fill="#0e0e1d" stroke="#6d5cff" stroke-width="1" stroke-opacity="0.5" filter="url(#shadow)"/>
  <text x="355" y="122" font-family="Inter,sans-serif" font-size="9" font-weight="700" fill="#a78bfa" letter-spacing="1" opacity="0.8">ATS SCORE</text>
  <text x="355" y="148" font-family="Inter,sans-serif" font-size="28" font-weight="900" fill="url(#grad1)" filter="url(#glow)">87%</text>
  <rect x="355" y="158" width="60" height="4" rx="2" fill="#6d5cff" opacity="0.3"/>
  <rect x="355" y="158" width="52" height="4" rx="2" fill="url(#grad1)" opacity="0.8"/>
  <text x="422" y="162" font-family="Inter,sans-serif" font-size="8" fill="#22c55e" opacity="0.9">+12%</text>

  <!-- Floating card 2 — Jobs Found -->
  <rect x="20" y="130" width="130" height="70" rx="12" fill="#0e0e1d" stroke="#22c55e" stroke-width="1" stroke-opacity="0.4" filter="url(#shadow)"/>
  <text x="35" y="152" font-family="Inter,sans-serif" font-size="9" font-weight="700" fill="#4ade80" letter-spacing="1" opacity="0.8">JOBS FOUND</text>
  <text x="35" y="176" font-family="Inter,sans-serif" font-size="24" font-weight="900" fill="#22c55e" filter="url(#glow)">52,493</text>
  <text x="35" y="190" font-family="Inter,sans-serif" font-size="8" fill="rgba(255,255,255,0.35)">Updated daily</text>

  <!-- Floating card 3 — AI Writing -->
  <rect x="22" y="230" width="130" height="60" rx="12" fill="#0e0e1d" stroke="#fbbf24" stroke-width="1" stroke-opacity="0.4" filter="url(#shadow)"/>
  <text x="37" y="252" font-family="Inter,sans-serif" font-size="9" font-weight="700" fill="#fbbf24" letter-spacing="1" opacity="0.8">AI RESUME</text>
  <rect x="37" y="260" width="90" height="4" rx="2" fill="rgba(255,255,255,0.08)"/>
  <rect x="37" y="268" width="70" height="4" rx="2" fill="rgba(255,255,255,0.06)"/>
  <rect x="37" y="276" width="80" height="4" rx="2" fill="rgba(255,255,255,0.06)"/>
  <circle cx="117" cy="265" r="8" fill="#fbbf24" opacity="0.15"/>
  <text x="113" y="269" font-family="Inter,sans-serif" font-size="10" fill="#fbbf24">✦</text>

  <!-- Floating card 4 — Interview AI -->
  <rect x="348" y="202" width="140" height="60" rx="12" fill="#0e0e1d" stroke="#818cf8" stroke-width="1" stroke-opacity="0.4" filter="url(#shadow)"/>
  <text x="363" y="223" font-family="Inter,sans-serif" font-size="9" font-weight="700" fill="#818cf8" letter-spacing="1" opacity="0.8">INTERVIEW AI</text>
  <rect x="363" y="231" width="60" height="4" rx="2" fill="#6d5cff" opacity="0.3"/>
  <rect x="363" y="239" width="40" height="4" rx="2" fill="#6d5cff" opacity="0.2"/>
  <rect x="363" y="247" width="80" height="4" rx="2" fill="#6d5cff" opacity="0.15"/>
  <circle cx="458" cy="242" r="10" fill="url(#grad1)" opacity="0.9"/>
  <text x="454" y="246" font-family="Inter,sans-serif" font-size="11" fill="white">🎙</text>

  <!-- Connection dots -->
  <circle cx="340" cy="140" r="3" fill="#6d5cff" opacity="0.6" filter="url(#glow)"/>
  <circle cx="150" cy="165" r="3" fill="#6d5cff" opacity="0.6" filter="url(#glow)"/>

  <!-- Floating dots decoration -->
  <circle cx="460" cy="60" r="4" fill="#6d5cff" opacity="0.4"/>
  <circle cx="475" cy="75" r="2.5" fill="#9c5fff" opacity="0.5"/>
  <circle cx="445" cy="78" r="2" fill="#818cf8" opacity="0.4"/>
  <circle cx="50" cy="60" r="3.5" fill="#22c55e" opacity="0.4"/>
  <circle cx="65" cy="75" r="2" fill="#4ade80" opacity="0.35"/>
  <circle cx="40" cy="80" r="2.5" fill="#22c55e" opacity="0.3"/>
  <circle cx="260" cy="360" r="4" fill="#fbbf24" opacity="0.3"/>
  <circle cx="280" cy="375" r="2.5" fill="#fbbf24" opacity="0.25"/>

  <!-- Laptop camera dot -->
  <circle cx="260" cy="92" r="2.5" fill="#2a2a50"/>
  <circle cx="260" cy="92" r="1" fill="#3a3a6a"/>
</svg>
