<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220" fill="none">
  <defs>
    <linearGradient id="pg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="gs"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="300" height="220" rx="16" fill="#0e0e1d"/>
  <rect x="1" y="1" width="298" height="218" rx="15" stroke="#6d5cff" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Glow -->
  <circle cx="150" cy="60" r="60" fill="#6d5cff" opacity="0.08"/>

  <!-- Document icon -->
  <rect x="110" y="20" width="80" height="100" rx="8" fill="#13132a" stroke="rgba(109,92,255,0.3)" stroke-width="1"/>
  <rect x="165" y="20" width="25" height="25" rx="0" fill="#0a0a18"/>
  <path d="M165 20 L190 45 L165 45 Z" fill="#1a1a35"/>
  <path d="M165 20 L190 20 L190 45 L165 45 Z" fill="#0e0e1d" stroke="rgba(109,92,255,0.2)" stroke-width="1"/>

  <!-- Document lines -->
  <rect x="122" y="52" width="56" height="4" rx="2" fill="#6d5cff" opacity="0.7"/>
  <rect x="122" y="63" width="50" height="3" rx="1.5" fill="rgba(255,255,255,0.2)"/>
  <rect x="122" y="72" width="45" height="3" rx="1.5" fill="rgba(255,255,255,0.15)"/>
  <rect x="122" y="81" width="54" height="3" rx="1.5" fill="rgba(255,255,255,0.12)"/>
  <rect x="122" y="90" width="40" height="3" rx="1.5" fill="rgba(255,255,255,0.1)"/>
  <rect x="122" y="99" width="52" height="3" rx="1.5" fill="rgba(255,255,255,0.08)"/>

  <!-- Sparkle/AI badge -->
  <circle cx="185" cy="55" r="14" fill="url(#pg)" filter="url(#gs)"/>
  <text x="179" y="60" font-family="sans-serif" font-size="13">✦</text>

  <!-- Score bar -->
  <rect x="60" y="138" width="180" height="28" rx="8" fill="#13132a" stroke="rgba(109,92,255,0.2)" stroke-width="1"/>
  <text x="72" y="156" font-family="Inter,sans-serif" font-size="9" font-weight="700" fill="rgba(255,255,255,0.5)" letter-spacing="0.5">ATS MATCH</text>
  <rect x="72" y="160" width="100" height="3" rx="1.5" fill="rgba(255,255,255,0.08)"/>
  <rect x="72" y="160" width="82" height="3" rx="1.5" fill="url(#pg)"/>
  <text x="188" y="158" font-family="Inter,sans-serif" font-size="10" font-weight="800" fill="#22c55e">82%</text>

  <!-- Bottom actions -->
  <rect x="60" y="176" width="80" height="24" rx="7" fill="url(#pg)"/>
  <text x="75" y="192" font-family="Inter,sans-serif" font-size="9" font-weight="700" fill="white">Generate ✦</text>
  <rect x="152" y="176" width="88" height="24" rx="7" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="164" y="192" font-family="Inter,sans-serif" font-size="9" font-weight="600" fill="rgba(255,255,255,0.6)">Download ↓</text>
</svg>
