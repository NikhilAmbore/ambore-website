name: Daily Apify Scraper (Indeed)

on:
  schedule:
    # Runs once a day at 07:00 UTC — avoids burning Apify credits on every hourly run
    - cron: '0 7 * * *'

  workflow_dispatch:
    inputs:
      verbose:
        description: 'Enable verbose logging'
        required: false
        default: 'false'

permissions:
  contents: write   # needed to push updated jobs.json

jobs:
  scrape-apify:
    name: Scrape LinkedIn & Indeed via Apify
    runs-on: ubuntu-latest
    timeout-minutes: 30   # Apify actors can take several minutes each

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install "httpx[http2]>=0.27.0" beautifulsoup4>=4.12.0 lxml>=5.0.0 brotli

      - name: Run Apify scrapers (LinkedIn + Indeed)
        env:
          # ── Apify (https://apify.com/ — $5 free credits/month) ───────────
          # Go to https://apify.com/ → sign up → Settings → Integrations → API tokens
          # Add your token as APIFY_TOKEN in GitHub Secrets (Settings → Secrets → Actions)
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}

        run: |
          VERBOSE_FLAG=""
          if [ "${{ github.event.inputs.verbose }}" = "true" ]; then
            VERBOSE_FLAG="--verbose"
          fi

          # Pull existing jobs so Apify results are merged, not overwritten
          python backend/job_scraper.py \
            --only-ats apify \
            --output /tmp/apify_jobs.json \
            $VERBOSE_FLAG

          echo "=== Apify results ==="
          python -c "
          import json
          jobs = json.load(open('/tmp/apify_jobs.json'))
          sources = {}
          for j in jobs:
              sources[j['ats']] = sources.get(j['ats'], 0) + 1
          print(f'Apify jobs: {len(jobs)}')
          for ats, cnt in sorted(sources.items(), key=lambda x: -x[1]):
              print(f'  {ats}: {cnt}')
          "

          # Merge Apify jobs into existing jobs.json — preserve first_seen_at, expire >45d
          python - <<'PYEOF'
          import json, pathlib
          from datetime import datetime, timezone, timedelta

          EXPIRE_DAYS   = 45
          now_utc       = datetime.now(timezone.utc)
          expire_cutoff = now_utc - timedelta(days=EXPIRE_DAYS)
          now_iso       = now_utc.isoformat()

          existing_path = pathlib.Path('backend/jobs.json')
          apify_path    = pathlib.Path('/tmp/apify_jobs.json')

          existing = json.loads(existing_path.read_text(encoding='utf-8')) if existing_path.exists() else []
          apify    = json.loads(apify_path.read_text(encoding='utf-8'))

          # Index existing by id to preserve first_seen_at
          existing_by_id = {j['id']: j for j in existing}

          # Stamp first_seen_at on fresh Apify jobs
          for j in apify:
              prev = existing_by_id.get(j['id'])
              j['first_seen_at'] = (prev or {}).get('first_seen_at') or j.get('scraped_at') or now_iso

          # Carry over non-Apify jobs (never drop them here)
          fresh_ids = {j['id'] for j in apify}
          non_apify = []
          for ex in existing:
              if ex.get('ats') != 'apify':
                  if 'first_seen_at' not in ex:
                      ex['first_seen_at'] = ex.get('scraped_at') or now_iso
                  non_apify.append(ex)

          merged = apify + non_apify

          # Expire jobs older than EXPIRE_DAYS
          def not_expired(j):
              fsa = j.get('first_seen_at') or j.get('scraped_at')
              if not fsa:
                  return True
              try:
                  dt = datetime.fromisoformat(fsa)
                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=timezone.utc)
                  return dt >= expire_cutoff
              except Exception:
                  return True

          before = len(merged)
          merged = [j for j in merged if not_expired(j)]
          expired = before - len(merged)

          existing_path.write_text(json.dumps(merged, indent=2, ensure_ascii=False), encoding='utf-8')
          print(f'Merged: {len(apify)} Apify + {len(non_apify)} other = {len(merged)} total  ({expired} expired)')
          PYEOF

      - name: Commit & push updated jobs.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/jobs.json
          if git diff --staged --quiet; then
            echo "No changes to jobs.json — skipping commit"
          else
            TOTAL=$(python -c "import json; print(len(json.load(open('backend/jobs.json'))))")
            git commit -m "chore: refresh Apify jobs (LinkedIn+Indeed) — ${TOTAL} total ($(date -u '+%Y-%m-%d'))"
            # Rebase onto latest remote before pushing (handles concurrent pushes)
            git pull --rebase origin main
            git push
          fi
