name: Daily API Scrapers (Apify + Adzuna + SerpAPI)

on:
  schedule:
    # Runs once a day at 07:00 UTC — avoids burning Apify credits on every hourly run
    - cron: '0 7 * * *'

  workflow_dispatch:
    inputs:
      verbose:
        description: 'Enable verbose logging'
        required: false
        default: 'false'

permissions:
  contents: write   # needed to push updated jobs.json

jobs:
  scrape-apify:
    name: Scrape LinkedIn & Indeed via Apify
    runs-on: ubuntu-latest
    timeout-minutes: 30   # Apify actors can take several minutes each

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install "httpx[http2]>=0.27.0" beautifulsoup4>=4.12.0 lxml>=5.0.0 brotli

      - name: Scrape daily API jobs (Apify + Adzuna + SerpAPI)
        env:
          APIFY_TOKEN:    ${{ secrets.APIFY_TOKEN }}
          ADZUNA_APP_ID:  ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          SERPAPI_KEY:    ${{ secrets.SERPAPI_KEY }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}

        run: |
          VERBOSE_FLAG=""
          if [ "${{ github.event.inputs.verbose }}" = "true" ]; then
            VERBOSE_FLAG="--verbose"
          fi

          python backend/job_scraper.py \
            --only-ats apify,adzuna,serpapi \
            --output /tmp/apify_fresh.json \
            $VERBOSE_FLAG

          echo "=== Daily API fresh results ==="
          python -c "
          import json
          jobs = json.load(open('/tmp/apify_fresh.json'))
          sources = {}
          for j in jobs:
              sources[j['ats']] = sources.get(j['ats'], 0) + 1
          print(f'Daily API fresh: {len(jobs)} jobs')
          for ats, cnt in sorted(sources.items(), key=lambda x: -x[1]):
              print(f'  {ats}: {cnt}')
          "

      - name: Merge Apify jobs with latest remote jobs.json
        # Use the same race-condition-safe pattern as scrape-jobs.yml:
        # fetch origin/main HEAD and merge at Python level before pushing.
        run: |
          git fetch origin main

          python3 - <<'PYEOF'
          import json, subprocess
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          from collections import Counter

          EXPIRE_DAYS   = 45
          now_utc       = datetime.now(timezone.utc)
          expire_cutoff = now_utc - timedelta(days=EXPIRE_DAYS)
          now_iso       = now_utc.isoformat()

          apify = json.loads(Path('/tmp/apify_fresh.json').read_text(encoding='utf-8'))

          # Get the LATEST remote jobs.json (not the stale local checkout)
          r = subprocess.run(
              ['git', 'show', 'origin/main:backend/jobs.json'],
              capture_output=True, text=True
          )
          existing = (
              json.loads(r.stdout)
              if r.returncode == 0 and r.stdout.strip().startswith('[')
              else []
          )
          print(f'Apify fresh: {len(apify)} | Remote HEAD: {len(existing)}')

          existing_by_id = {j['id']: j for j in existing}

          # Stamp first_seen_at on fresh Apify jobs
          for j in apify:
              prev = existing_by_id.get(j['id'])
              j['first_seen_at'] = (
                  (prev or {}).get('first_seen_at')
                  or j.get('scraped_at')
                  or now_iso
              )

          # ATS types refreshed by this daily workflow
          DAILY_ATES = {'apify', 'adzuna', 'serpapi'}

          # Carry over all jobs from non-daily ATS sources, plus old daily jobs not in fresh set
          fresh_ids = {j['id'] for j in apify}
          carried = 0
          for ex in existing:
              if ex.get('ats') not in DAILY_ATES:
                  if 'first_seen_at' not in ex:
                      ex['first_seen_at'] = ex.get('scraped_at') or now_iso
                  apify.append(ex)
                  carried += 1
              elif ex['id'] not in fresh_ids:
                  if 'first_seen_at' not in ex:
                      ex['first_seen_at'] = ex.get('scraped_at') or now_iso
                  apify.append(ex)
                  carried += 1

          def not_expired(j):
              fsa = j.get('first_seen_at') or j.get('scraped_at')
              if not fsa:
                  return True
              try:
                  dt = datetime.fromisoformat(fsa)
                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=timezone.utc)
                  return dt >= expire_cutoff
              except Exception:
                  return True

          before = len(apify)
          merged = [j for j in apify if not_expired(j)]
          expired = before - len(merged)

          # Cap at 50 000 most-recent jobs so jobs.json never exceeds GitHub's 100 MB limit
          MAX_JOBS = 50_000
          if len(merged) > MAX_JOBS:
              merged.sort(key=lambda j: j.get('first_seen_at') or j.get('scraped_at') or '', reverse=True)
              trimmed = len(merged) - MAX_JOBS
              merged  = merged[:MAX_JOBS]
          else:
              trimmed = 0

          Path('backend/jobs.json').write_text(
              json.dumps(merged, indent=2, ensure_ascii=False),
              encoding='utf-8'
          )
          atses = Counter(j['ats'] for j in merged)
          print(f'Merge done — {len(merged)} total ({carried} carried over, {expired} expired, {trimmed} trimmed to cap)')
          for ats, cnt in sorted(atses.items(), key=lambda x: -x[1]):
              print(f'  {ats}: {cnt}')
          PYEOF

      - name: Commit & push updated jobs.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/jobs.json
          if git diff --staged --quiet; then
            echo "No changes to jobs.json — skipping commit"
          else
            TOTAL=$(python -c "import json; print(len(json.load(open('backend/jobs.json'))))")
            git commit -m "chore: daily API refresh (Apify+Adzuna+SerpAPI) — ${TOTAL} total ($(date -u '+%Y-%m-%d'))"
            for attempt in 1 2 3; do
              git pull --rebase -X ours origin main && git push && break
              echo "Push attempt $attempt failed — retrying in 10s..."
              sleep 10
            done
          fi
