[build]
  publish = "."

# ── Security & Trust Headers (applied to all pages) ──────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    # Prevent clickjacking
    X-Frame-Options         = "SAMEORIGIN"
    # Prevent MIME-type sniffing
    X-Content-Type-Options  = "nosniff"
    # XSS filter (legacy browsers)
    X-XSS-Protection        = "1; mode=block"
    # Minimal referrer info to external sites
    Referrer-Policy         = "strict-origin-when-cross-origin"
    # Allow mic for Interview AI only; block camera, geolocation, payment
    Permissions-Policy      = "camera=(), microphone=(self), geolocation=(), payment=()"
    # Force HTTPS for 1 year
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Content Security Policy — whitelist only trusted domains
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com; connect-src 'self' https://api.anthropic.com https://web-production-d62ab.up.railway.app https://www.google-analytics.com https://region1.google-analytics.com https://analytics.google.com; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://www.google-analytics.com; frame-ancestors 'none'; form-action 'self'; base-uri 'self'"

# ── HTML pages: 1-hour cache + stale-while-revalidate ────────────────────────
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

# ── Jobs data: 5-minute cache (updates hourly via GitHub Actions) ─────────────
[[headers]]
  for = "/backend/jobs.json"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=600"

# ── Static assets: 30-day cache ───────────────────────────────────────────────
[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"
