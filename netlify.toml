[build]
  publish = "."

# ── Functions ─────────────────────────────────────────────────────────────────
[functions]
  directory = "netlify/functions"

# Dodo Payments webhook — raw body must be preserved for signature verification
[functions."dodo-webhook"]
  included_files = []

# ── Edge Functions ────────────────────────────────────────────────────────────
# claude-proxy — serverless AI proxy that keeps the Anthropic key server-side.
# Mounted at /api/claude; all HTML pages POST here instead of calling
# api.anthropic.com directly.
[[edge_functions]]
  path     = "/api/claude"
  function = "claude-proxy"

[[edge_functions]]
  path     = "/api/community-upload"
  function = "community-upload"

# ── Auto-minify CSS, JS, HTML ────────────────────────────────────────────────
[build.processing]
  skip_processing = false
[build.processing.css]
  bundle = true
  minify = true
[build.processing.js]
  bundle = true
  minify = true
[build.processing.html]
  pretty_urls = true
[build.processing.images]
  compress = true

# ── Security & Trust Headers (all pages) ─────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options           = "SAMEORIGIN"
    X-Content-Type-Options    = "nosniff"
    X-XSS-Protection          = "1; mode=block"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Permissions-Policy        = "camera=(), microphone=(self), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy   = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://accounts.google.com; worker-src blob: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; connect-src 'self' https://astraoffer.org https://api.anthropic.com https://mqonctgrvppdbjcuawue.supabase.co https://web-production-d62ab.up.railway.app https://www.google-analytics.com https://region1.google-analytics.com https://analytics.google.com https://www.googleapis.com https://accounts.google.com https://ingesteer.services-prod.nsvcs.net https://cdn.jsdelivr.net https://api.github.com; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; img-src 'self' data: blob: https://www.google-analytics.com https://lh3.googleusercontent.com; frame-src 'self' blob: https://accounts.google.com; frame-ancestors 'none'; form-action 'self'; base-uri 'self'"
    Vary                      = "Accept-Encoding"

# ── HTML pages: always fresh — no CDN cache, browser revalidates every request ─
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── Root (index) ──────────────────────────────────────────────────────────────
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── Jobs JSON: 5-min CDN cache, serve stale up to 10 min ─────────────────────
[[headers]]
  for = "/backend/jobs.json"
  [headers.values]
    Cache-Control = "public, max-age=300, s-maxage=300, stale-while-revalidate=600, stale-if-error=3600"

# ── Fonts: cache 1 year (immutable) ──────────────────────────────────────────
[[headers]]
  for = "*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.woff"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── CSS & JS: short cache so updates propagate quickly ───────────────────────
[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

# ── Community PDFs: serve with correct content-type, short cache ──────────────
[[headers]]
  for = "/community-docs/*.pdf"
  [headers.values]
    Content-Type  = "application/pdf"
    Cache-Control = "public, max-age=300, s-maxage=300"

# ── Images: cache 7 days ──────────────────────────────────────────────────────
[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "*.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "*.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800"
